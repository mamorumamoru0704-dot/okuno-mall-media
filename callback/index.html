<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Threads 認証完了</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 3rem auto; max-width: 42rem; padding: 0 1.25rem; color: #171717; }
      code { display: block; overflow-wrap: anywhere; padding: 1rem; border-radius: .5rem; background: #f3f4f6; }
    </style>
  </head>
  <body>
    <h1>Threads の認証が完了しました</h1>
    <p>このページは認証結果をこのブラウザに表示するだけです。認証コードは保存・送信しません。</p>
    <code id="result">認証情報を確認しています…</code>
    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const error = params.get("error");
      document.getElementById("result").textContent = error
        ? `認証エラー: ${error}`
        : code
          ? `認証コードを受信しました。Codexが安全に処理します。`
          : "認証コードが見つかりませんでした。";
    </script>
  </body>
</html>
